[supervisord]
nodaemon=true
logfile         = /var/log/supervisor/supervisord.log
logfile_maxbytes= 50MB
logfile_backups = 10
loglevel        = info             ; debug is chatty once it's stable
pidfile         = /var/run/supervisord.pid

[program:api]
directory       = /opt/program
command         = python -u /opt/program/GroundingDINO/api_service.py   ; -u = un-buffered
autostart       = true
autorestart     = true
startsecs       = 5
startretries    = 5
stdout_logfile  = /var/log/supervisor/api-out.log
stdout_logfile_maxbytes = 10MB
stderr_logfile  = /var/log/supervisor/api-err.log
stderr_logfile_maxbytes = 10MB
redirect_stderr = false           ; you already split stdout/stderr
environment     = PYTHONUNBUFFERED="1"
